[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-portfolio-research"
version = "0.0.0"
description = "ETF strategy portfolio analytics and costed cap-correction research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.6"]
paper = ["pandas>=2", "exchange_calendars>=4.5"]

[project.scripts]
trend-portfolio = "trend_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
  "tests/test_analytics.py",
  "tests/test_cli.py",
  "tests/test_cap_event_engine.py",
  "tests/test_cap_rebalance.py",
  "tests/test_cap_publication.py",
  "tests/test_publication_integrity.py",
  "tests/test_etf_documentation.py",
  "tests/test_daily_returns.py",
  "tests/test_paper_engine.py",
]
pythonpath = ["src"]
