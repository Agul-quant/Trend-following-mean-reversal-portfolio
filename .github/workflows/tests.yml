name: Synthetic analytics tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,plots]'
      - run: python -m pytest -q
      - run: python scripts/verify_project.py
      - run: python scripts/verify_no_bond_portfolios.py --public-report reports/no_bond_portfolios/report.json
      - run: python scripts/verify_final_no_bond.py --report reports/final_no_bond_portfolios/report.json --source-report reports/no_bond_portfolios/report.json
      - run: python scripts/verify_final_cap.py --report-dir reports/final_cap_rebalancing --config configs/final_cap_rebalancing.json
